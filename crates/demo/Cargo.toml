[package]
name = "arb-demo"
version = "0.1.0"
edition = "2024"

[dependencies]
# Local crates
adapters = { path = "../adapters" }
execution = { path = "../execution" }
marketdata = { path = "../marketdata" }
orderbook = { path = "../orderbook" }
strategy = { path = "../strategy", features = ["storage"] }
stroage = { path = "../stroage" }

# External dependencies
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = "0.3.18"
rust_decimal = { workspace = true }
rust_decimal_macros = { workspace = true }
futures = { workspace = true }
dotenv = { workspace = true }

[[bin]]
name = "mock_execution_demo"
path = "src/mock_execution_demo.rs"

[[bin]]
name = "test_db"
path = "src/test_db.rs"

[[bin]]
name = "test_storage_integration"
path = "src/test_storage_integration.rs"
