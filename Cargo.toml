[workspace.package]
version = "0.1.0"
edition = "2024"
description = "ARB"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/Shradhesh71/ArbCore"

[workspace]
members = [ "crates/adapters", "crates/demo", "crates/execution", "crates/marketdata",
    "crates/orderbook", "crates/strategy", "crates/stroage",
]
resolver = "2"

[workspace.dependencies]
actix-web = "4.11.0"
tokio = {version = "1.48.0", features = ["rt", "time","macros","sync"]}
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenv = "0.15"
reqwest = { version = "0.12.24", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1.32", features = ["serde"] }
rust_decimal_macros = "1.39.0"
parking_lot = "0.12.5"
thiserror = "2.0.17"
toml = "0.9.8"
uuid = {version = "1.18.1", features = ["v4", "serde"]}
tokio-tungstenite = { version = "0.28.0", features = ["native-tls"] }
futures = "0.3.31"
rand = "0.9.2"
tracing = "0.1.41"
async-trait = "0.1.89"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "macros", "rust_decimal"] }